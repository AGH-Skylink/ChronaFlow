<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>ChronaFlow Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Monaco,
          Consolas, "Liberation Mono", "Courier New", monospace;
        background: #0b0d12;
        color: #e5e7eb;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 520px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(229, 231, 235, 0.9);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>ChronaFlow is offline</h1>
        <p>
          Load the app once while online to cache it, then you can keep using it
          offline.
        </p>
      </div>
    </main>
  </body>
</html>
